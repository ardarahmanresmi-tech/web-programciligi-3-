<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İletişim - Kişisel Web Sitesi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Kişisel Web Sitem</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="hakkimda.html">Hakkımda</a>
            <a href="iletisim.html">İletişim</a>
        </nav>
    </header>

    <main>
        <h2>İletişim Formu</h2>
        <form action="#" method="post">
            <p>
                <label for="ad">Adınız Soyadınız:</label><br>
                <input type="text" id="ad" name="ad" required>
            </p>
            <p>
                <label for="eposta">E-posta Adresiniz:</label><br>
                <input type="email" id="eposta" name="eposta" required>
            </p>
            <p>
                <label for="mesaj">Mesajınız:</label><br>
                <textarea id="mesaj" name="mesaj" rows="4" cols="40" required></textarea>
            </p>
            <p>
                <button type="submit">Gönder</button>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Kişisel Web Sitesi Projesi.</p>
    </footer>
</body>
</html>
